<svg
  width="880"
  height="192"
  viewBox="0 0 880 192"
  xmlns="http://www.w3.org/2000/svg"
>

  <style>
    /* ================= BASE ================= */
    :root {
      --bg: #1f2330;
      --java: #c0841a;
      --kotlin: #b085ff;
      --ts: #4fa3ff;
      --js: #f2e85c;
      --html: #f05a28;
    }

    rect.bg {
      fill: var(--bg);
    }

    /* ================= GRID ================= */
    .cell {
      fill: #2b3040;
      rx: 4;
      ry: 4;
    }

    /* ================= SNAKE ================= */
    .snake {
      rx: 6;
      ry: 6;
      animation: move 8s linear infinite;
    }

    .java   { fill: var(--java); animation-delay: 0s; }
    .kotlin{ fill: var(--kotlin); animation-delay: -1s; }
    .ts     { fill: var(--ts); animation-delay: -2s; }
    .js     { fill: var(--js); animation-delay: -3s; }
    .html   { fill: var(--html); animation-delay: -4s; }

    @keyframes move {
      0%   { transform: translateX(-200px); }
      100% { transform: translateX(1080px); }
    }
  </style>

  <!-- FUNDO -->
  <rect class="bg" width="880" height="192" rx="16"/>

  <!-- GRID SIMPLIFICADO -->
  <g transform="translate(40,40)">
    <rect class="cell" x="0" y="0" width="32" height="32"/>
    <rect class="cell" x="40" y="0" width="32" height="32"/>
    <rect class="cell" x="80" y="0" width="32" height="32"/>
    <rect class="cell" x="120" y="0" width="32" height="32"/>
    <rect class="cell" x="160" y="0" width="32" height="32"/>
    <rect class="cell" x="200" y="0" width="32" height="32"/>
    <rect class="cell" x="240" y="0" width="32" height="32"/>
    <rect class="cell" x="280" y="0" width="32" height="32"/>
  </g>

  <!-- ================= SNAKE ANIMADO ================= -->
  <g transform="translate(40,80)">
    <rect class="snake java"    x="0"   y="0" width="32" height="32"/>
    <rect class="snake kotlin"  x="36"  y="0" width="32" height="32"/>
    <rect class="snake ts"      x="72"  y="0" width="32" height="32"/>
    <rect class="snake js"      x="108" y="0" width="32" height="32"/>
    <rect class="snake html"    x="144" y="0" width="32" height="32"/>
  </g>

</svg>
