<svg viewBox="-16 -32 880 192"
     width="880"
     height="192"
     xmlns="http://www.w3.org/2000/svg">
  <desc>Custom github-snake with language palette</desc>

  <style>
    :root {
      --cb: #1f2330;
      --ce: #2b3040;

      /* Paleta personalizada */
      --c1: #c0841a; /* Java */
      --c2: #b085ff; /* Kotlin */
      --c3: #4fa3ff; /* TypeScript */
      --c4: #f05a28; /* HTML / Swift */
      --cs: #ff5c8a; /* Snake head */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cb: #1f2330;
        --ce: #161b22;
        --c1: #c0841a;
        --c2: #b085ff;
        --c3: #4fa3ff;
        --c4: #f05a28;
      }
    }

    /* Quadrados do grid */
    .c {
      shape-rendering: geometricPrecision;
      fill: var(--ce);
      stroke: var(--cb);
      stroke-width: 1;
      rx: 3;
      ry: 3;
      animation: none 46100ms linear infinite;
    }

    /* Snake */
    .s {
      fill: var(--cs);
      animation: none linear 46100ms infinite;
    }

    /* Progress bar (comida) */
    .u {
      animation: none linear 46100ms infinite;
      transform-origin: 0 0;
    }
  </style>

  <!-- 🔽
    IMPORTANTE:
    A partir daqui você pode colar
    EXATAMENTE o miolo <rect ...>
    do SVG que você já mandou
    (sem alterar os keyframes)
  🔽 -->

  <!-- EXEMPLO curto (snake head) -->
  <rect class="s s0" x="0.8" y="0.8" width="14.4" height="14.4" rx="6"/>
  <rect class="s s1" x="1.8" y="1.8" width="12.3" height="12.3" rx="5"/>
  <rect class="s s2" x="2.6" y="2.6" width="10.8" height="10.8" rx="4"/>
  <rect class="s s3" x="3.0" y="3.0" width="9.9" height="9.9" rx="4"/>

</svg>
