        --ce:#1f2430;
        --cb:#00000055;
        --cs:#ff6b8b;

        --c1:#f6e27a;
        --c2:#5aa9ff;
        --c3:#b084f5;
        --c4:#ff7a45;     /* HTML / Swift (laranja) */
